name: ci

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  dependency-mirror:
    uses: ./.github/workflows/dependency-mirror.yml
    permissions:
      contents: write
    with:
      dependencies: |
        - url: https://archive.apache.org/dist/hadoop/common/hadoop-3.1.2/hadoop-3.1.2.tar.gz
          checksum: sha256:1c02ccc60a09c63a48dc4234ffd3aed1b75e5a1f2b49d60927eda114b93dd31a
        - url: https://archive.apache.org/dist/hadoop/common/hadoop-3.1.4/hadoop-3.1.4.tar.gz
          checksum: sha512:f7eff67e948e21e23d7069dc169c98fcce757f59473e1e9a0e27d69a23df88840a9776089eeae5a8e1e496753f811868fe65638b04e3388c197931cd44d86f63
        - url: https://archive.apache.org/dist/hadoop/common/hadoop-3.4.2/hadoop-3.4.2-lean.tar.gz
          checksum: sha512:53582b3dae515316933c8486cdbd688a93530deb4bcc842e6a599f33dfeb51b17d79f61dc15b6febe95715325c2d2f4fc503bfae6ec3226851644ba7ebae8930
        - url: https://archive.apache.org/dist/hadoop/common/hadoop-3.4.2/hadoop-3.4.2-aarch64-lean.tar.gz
          checksum: sha512:d99a36c499d445152bb097531b3746d2bb4130c801d50fffa93aff63a13b43db135d06d636f9aaf6fcae5ebb882a069bd07ce53ade8edb66cff37b839049a2d9
        - url: https://archive.apache.org/dist/hive/hive-3.1.3/apache-hive-3.1.3-bin.tar.gz
          checksum: sha256:0c9b6a6359a7341b6029cc9347435ee7b379f93846f779d710b13f795b54bb16
        - url: https://archive.apache.org/dist/spark/spark-3.3.1/spark-3.3.1-bin-hadoop3.tgz
          checksum: sha512:769db39a560a95fd88b58ed3e9e7d1e92fb68ee406689fb4d30c033cb5911e05c1942dcc70e5ec4585df84e80aabbc272b9386a208debda89522efff1335c8ff
        - url: https://archive.apache.org/dist/spark/spark-4.0.0/spark-4.0.0-bin-hadoop3.tgz
          checksum: sha512:b5a9e2ea22ac971bad81ab079e510f1ab92732efaf790af4b895174b28d99a65d35543f4300caa073257b6fe42062daafe3eea106d1945806166098606f8d03c
        - url: https://archive.apache.org/dist/spark/spark-4.1.0/spark-4.1.0-bin-hadoop3.tgz
          checksum: sha512:fff7f929d98779b096a2d2395b1b9db1ce277660f3852dd45e1457c373013f2669074315252181a3cea291d8f3a726c70f7f9b247e723edbf8080f40888edde1

  build-images:
    needs: dependency-mirror
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Images with large external downloads first (fail fast)
          - image: testing/hive3.1-hive
            platform: linux/amd64
            runner: ubuntu-24.04
            test: hive3.1-hive
          - image: testing/hive3.1-hive
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: hive3.1-hive
          - image: testing/hive3.1
            platform: linux/amd64
            runner: ubuntu-24.04
            test: hive3.1
          - image: testing/hive3.1
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: hive3.1
          - image: testing/hive3.1-kerberos
            platform: linux/amd64
            runner: ubuntu-24.04
            test: hive3.1-kerberos
            test_images: testing/kdc
          - image: testing/hive3.1-kerberos
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: hive3.1-kerberos
            test_images: testing/kdc

          - image: testing/hive4.0-hive
            platform: linux/amd64
            runner: ubuntu-24.04
            test: hive4.0-hive
          - image: testing/hive4.0-hive
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: hive4.0-hive

          - image: testing/hdp3.1-hive-kerberized
            runner: ubuntu-24.04
            test: hdp3.1-hive

          - image: testing/spark4-iceberg
            platform: linux/amd64
            runner: ubuntu-24.04
            test: spark4-iceberg
          - image: testing/spark4-iceberg
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: spark4-iceberg

          - image: testing/iceberg-rest
            platform: linux/amd64
            runner: ubuntu-24.04
            test: iceberg-rest
          - image: testing/iceberg-rest
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: iceberg-rest

          - image: testing/spark4-delta
            platform: linux/amd64
            runner: ubuntu-24.04
            test: spark4-delta
          - image: testing/spark4-delta
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: spark4-delta

          - image: testing/spark3-hudi
            platform: linux/amd64
            runner: ubuntu-24.04
            test: spark3-hudi
          - image: testing/spark3-hudi
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: spark3-hudi

          # Images without external downloads
          - image: testing/kerberos
            platform: linux/amd64
            runner: ubuntu-24.04
            test: kerberos
          - image: testing/kerberos
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: kerberos
          - image: testing/kdc
            platform: linux/amd64
            runner: ubuntu-24.04
            test: kdc
          - image: testing/kdc
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: kdc

          - image: testing/almalinux9-oj17
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: testing/almalinux9-oj17
            platform: linux/arm64
            runner: ubuntu-24.04-arm

          - image: testing/almalinux9-oj17-openldap-referrals
            platform: linux/amd64
            runner: ubuntu-24.04
            test: openldap
          - image: testing/almalinux9-oj17-openldap-referrals
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: openldap

          - image: testing/almalinux9-oj17-openldap-active-directory
            platform: linux/amd64
            runner: ubuntu-24.04
            test: openldap-active-directory
          - image: testing/almalinux9-oj17-openldap-active-directory
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: openldap-active-directory

          - image: build/sphinx
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: build/sphinx
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # checkout tags so version in Manifest is set properly
    - name: Build ${{ matrix.image }} (${{ matrix.platform }})
      env:
        PLATFORM: ${{ matrix.platform }}
      run: make "${{ matrix.image }}"
    - name: Build test dependencies
      env:
        PLATFORM: ${{ matrix.platform }}
      if: ${{ matrix.test_images != '' }}
      run: |
        for image in ${{ matrix.test_images }}; do
          make "$image"
        done
    - name: Test ${{ matrix.test }}
      env:
        PLATFORM: ${{ matrix.platform }}
      if: ${{ matrix.test  != '' }}
      shell: 'script -q -e -c "bash {0}"'
      run: make test IMAGE_TO_TEST="${{ matrix.test }}"
